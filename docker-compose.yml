version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: neighbourhood_events_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: neighbourhood_events
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: neighbourhood_events_backend
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/neighbourhood_events?schema=public
      JWT_SECRET: supersecretjwtkeyfornairobi2026
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  pgdata:
